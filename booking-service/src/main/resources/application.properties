spring.application.name=booking-service

server.port=8081

spring.datasource.url=jdbc:h2:file:./data/cinema-booking-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

services.user.base-url=http://localhost:8085
services.screening.base-url=http://localhost:8084
services.payment.base-url=http://localhost:8083

springdoc.api-docs.version=OPENAPI_3_0